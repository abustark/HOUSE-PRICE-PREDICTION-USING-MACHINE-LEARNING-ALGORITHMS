[package]
name = "hpp-cli"
version = "0.1.0"
edition = "2021"
description = "High-performance parallel dataset cleaning & ETL engine for Bengaluru House Price Data"
authors = ["Basith AbuSyed <abustark>"]

[dependencies]
hpp-core = { path = "../hpp-core" }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
