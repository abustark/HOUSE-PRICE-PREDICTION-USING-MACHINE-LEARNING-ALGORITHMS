[package]
name = "hpp-pyo3"
version = "0.1.0"
edition = "2021"
description = "High-performance PyO3 native extension module for Bengaluru House Price Prediction"
authors = ["Basith AbuSyed <abustark>"]

[lib]
name = "hpp_fast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hpp-core = { path = "../hpp-core" }
