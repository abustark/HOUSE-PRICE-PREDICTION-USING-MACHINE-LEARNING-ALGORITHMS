[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "hpp-fast"
version = "0.1.0"
description = "High-performance PyO3 native extension module for Bengaluru House Price Prediction"
authors = [{ name = "Basith AbuSyed", email = "abustark@example.com" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "hpp_fast"
