[package]
name = "hpp-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly zero-latency client-side inference engine for Bengaluru House Price Prediction"
authors = ["Basith AbuSyed <abustark>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hpp-core = { path = "../hpp-core" }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]
